<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="Painel de Controle Weellu">
  <meta name="theme-color" content="#009b6e">

  <script>
    // Force clear any old service workers and cache storage
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Weellu">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20261110_08">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=20261110_08"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=20261110_08"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=20261110_08"/>
  <link rel="shortcut icon" href="favicon.png?v=20261110_08"/>

  <title>Weellu - Painel de Controle</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js?v=20261110_08" async></script>
</body>
</html>
